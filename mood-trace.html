<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情軌跡 · Mood Trace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#080810;color:#e8e8ec;transition:background .3s,color .3s;}
body.light{background:#f7f5f0;color:#1a1a1a;}
#app{max-width:780px;margin:0 auto;padding:16px;}
h1{font-size:14px;font-weight:500;letter-spacing:.08em;opacity:.5;margin-bottom:14px;}
#top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.cb{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s,border-color .1s;flex-shrink:0;}
.cb.active{border-color:#fff;transform:scale(1.2);}
body.light .cb.active{border-color:#222;}
.btn{font-size:12px;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);color:#e8e8ec;transition:background .15s;}
body.light .btn{border-color:rgba(0,0,0,0.15);background:rgba(0,0,0,0.05);color:#1a1a1a;}
.btn:hover{background:rgba(255,255,255,0.12);}
body.light .btn:hover{background:rgba(0,0,0,0.1);}
#canvas-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);}
body.light #canvas-wrap{border-color:rgba(0,0,0,0.1);}
canvas{display:block;width:100%;}
#pc{position:absolute;top:0;left:0;pointer-events:none;width:100%;}
#time-section{margin-top:14px;}
#ttrack-wrap{position:relative;padding-bottom:22px;}
#ttrack{display:flex;align-items:flex-end;gap:0;height:36px;cursor:pointer;position:relative;}
.ts{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;position:relative;padding-bottom:0;}
.ts-tick{width:1px;background:rgba(255,255,255,0.2);transition:background .1s,height .1s;}
body.light .ts-tick{background:rgba(0,0,0,0.18);}
.ts:nth-child(6n+1) .ts-tick{width:1.5px;}
.ts.active .ts-tick{background:#fff;width:2px;}
body.light .ts.active .ts-tick{background:#222;}
.ts-lbl{position:absolute;bottom:-18px;font-size:10px;opacity:0;white-space:nowrap;transform:translateX(-50%);left:50%;transition:opacity .1s;}
.ts:nth-child(6n+1) .ts-lbl{opacity:.4;}
body.light .ts-lbl{color:#1a1a1a;}
.ts.active .ts-lbl{opacity:1 !important;}
#ttrack-line{position:absolute;bottom:22px;left:0;right:0;height:1px;background:rgba(255,255,255,0.1);}
body.light #ttrack-line{background:rgba(0,0,0,0.1);}
#tlabel{font-size:11px;opacity:.5;margin-top:6px;}
#prow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.pchip{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);opacity:.8;}
body.light .pchip{border-color:rgba(0,0,0,0.1);}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
#stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.stat{padding:6px 12px;border-radius:8px;font-size:12px;background:rgba(255,255,255,0.05);opacity:.85;}
body.light .stat{background:rgba(0,0,0,0.05);}
#export-row{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);}
body.light #export-row{border-color:rgba(0,0,0,0.1);}
#eprev{border-radius:8px;flex-shrink:0;}
#einfo{font-size:12px;line-height:1.7;opacity:.75;}
#edate{font-weight:500;font-size:13px;opacity:1;}
</style>
</head>
<body>
<div id="app">
  <h1>MOOD TRACE · 心情軌跡</h1>

  <div id="top">
    <div style="display:flex;gap:4px;flex-wrap:wrap;" id="crow"></div>
    <div style="width:1px;height:18px;background:rgba(255,255,255,0.15);flex-shrink:0;"></div>
    <button class="btn" id="bgtog">切換背景</button>
    <button class="btn" id="addbot">+ 加路人</button>
    <button class="btn" id="demobtn">示範一天</button>
    <button class="btn" id="clearbtn">清除</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="mc" width="760" height="480"></canvas>
    <canvas id="pc" width="760" height="480"></canvas>
  </div>

  <div id="time-section">
    <div id="ttrack-wrap">
      <div id="ttrack-line"></div>
      <div id="ttrack"></div>
    </div>
    <div id="tlabel">時段：清晨 06:00 — 選好顏色，在畫布上塗出你這個時段的心情</div>
  </div>

  <div id="prow"></div>

  <div id="stats">
    <div class="stat">交錯點 <strong id="sc">0</strong></div>
    <div class="stat">圖騰 <strong id="sp">0</strong></div>
    <div class="stat">參與者 <strong id="sppl">0</strong></div>
  </div>

  <div id="export-row">
    <canvas id="eprev" width="88" height="88"></canvas>
    <div>
      <div id="edate"></div>
      <div id="einfo">今日心情圖騰</div>
      <button class="btn" style="margin-top:8px;" id="expbtn">匯出 PNG</button>
    </div>
  </div>
</div>

<script>
const mc=document.getElementById('mc'),pc=document.getElementById('pc');
const mCtx=mc.getContext('2d'),pCtx=pc.getContext('2d');
const W=760,H=480,G=38;
const COLS=Math.floor(W/G),ROWS=Math.floor(H/G);
const OX=(W-COLS*G)/2,OY=(H-ROWS*G)/2;

const RB=['#FF3B3B','#FF7A00','#FFB800','#84CC16','#22C55E','#06B6D4','#3B82F6','#6366F1','#A855F7','#EC4899'];
const RBN=['紅','橙','黃','草綠','翠綠','青','藍','靛','紫','粉'];
const HRS=Array.from({length:18},(_,i)=>6+i);
const TN=['清晨06','清晨07','上午08','上午09','上午10','上午11','正午12','下午13','下午14','下午15','下午16','傍晚17','傍晚18','夜晚19','夜晚20','深夜21','深夜22','深夜23'];

let dark=true,myCol=RB[0],curSlot=0,drawing=false,bi=0;
let slots={};
HRS.forEach(h=>{slots[h]={my:null,myCol:RB[0],bots:[]};});
let crossings=[];

function mkColors(){
  const r=document.getElementById('crow');r.innerHTML='';
  RB.forEach((c,i)=>{
    const b=document.createElement('div');b.className='cb'+(i===0?' active':'');
    b.style.background=c;b.title=RBN[i];
    b.addEventListener('click',()=>{
      document.querySelectorAll('.cb').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');myCol=c;
    });
    r.appendChild(b);
  });
}
mkColors();

function mkTrack(){
  const tr=document.getElementById('ttrack');tr.innerHTML='';
  HRS.forEach((h,i)=>{
    const s=document.createElement('div');
    s.className='ts'+(i===0?' active':'');
    // tick height: taller on hour marks, shorter in between
    const isMajor=(i%6===0);
    const tickH=isMajor?20:12;
    s.innerHTML=`<div class="ts-tick" style="height:${tickH}px"></div><span class="ts-lbl">${String(h).padStart(2,'0')}</span>`;
    s.addEventListener('click',()=>{
      document.querySelectorAll('.ts').forEach(x=>x.classList.remove('active'));
      s.classList.add('active');curSlot=i;
      document.getElementById('tlabel').textContent=`時段：${TN[i]}:00 — 選好顏色，在畫布上塗出你這個時段的心情`;
      redraw();
    });
    tr.appendChild(s);
  });
}
mkTrack();

document.getElementById('bgtog').addEventListener('click',()=>{
  dark=!dark;document.body.classList.toggle('light',!dark);mkTrack();redraw();
});

function snap(x,y){
  const c=Math.round((x-OX)/G),r=Math.round((y-OY)/G);
  return{col:Math.max(0,Math.min(COLS,c)),row:Math.max(0,Math.min(ROWS,r)),
    x:OX+Math.max(0,Math.min(COLS,c))*G,y:OY+Math.max(0,Math.min(ROWS,r))*G};
}

function drawBg(ctx,w,h,bgDark){
  ctx.fillStyle=bgDark?'#080810':'#f7f5f0';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=bgDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.07)';ctx.lineWidth=0.5;
  for(let c=0;c<=COLS;c++){const x=OX+c*G;ctx.beginPath();ctx.moveTo(x,OY);ctx.lineTo(x,OY+ROWS*G);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){const y=OY+r*G;ctx.beginPath();ctx.moveTo(OX,y);ctx.lineTo(OX+COLS*G,y);ctx.stroke();}
  ctx.fillStyle=bgDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.1)';
  for(let c=0;c<=COLS;c++)for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.arc(OX+c*G,OY+r*G,1.7,0,Math.PI*2);ctx.fill();}
}

function drawPath(ctx,pts,col,alpha,lw){
  if(!pts||pts.length<2)return;
  ctx.save();ctx.strokeStyle=col;ctx.globalAlpha=alpha;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();
  ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,5,0,Math.PI*2);ctx.fillStyle=col;ctx.globalAlpha=alpha;ctx.fill();
  ctx.beginPath();ctx.arc(pts[pts.length-1].x,pts[pts.length-1].y,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function pk(p){return p.col+'_'+p.row;}

function calcCross(){
  crossings=[];
  HRS.forEach(h=>{
    const d=slots[h];const all=[];
    if(d.my&&d.my.length>0)all.push({pts:d.my,col:d.myCol});
    d.bots.forEach(b=>all.push(b));
    for(let i=0;i<all.length;i++){
      const sa=new Set(all[i].pts.map(pk));
      for(let j=i+1;j<all.length;j++){
        all[j].pts.forEach(p=>{
          if(sa.has(pk(p))&&!crossings.find(c=>c.col===p.col&&c.row===p.row)){
            crossings.push({...p,c1:all[i].col,c2:all[j].col});
          }
        });
      }
    }
  });
  document.getElementById('sc').textContent=crossings.length;
  document.getElementById('sp').textContent=crossings.length;
}

function kaleido(ctx,x,y,c1,c2,sz,bgDark){
  sz=sz||G*0.86;ctx.save();ctx.translate(x,y);
  const arms=10;
  for(let i=0;i<arms;i++){
    ctx.save();ctx.rotate((i/arms)*Math.PI*2);
    ctx.globalAlpha=0.62;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(sz*.43,-sz*.16);ctx.lineTo(sz*.84,0);ctx.lineTo(sz*.43,sz*.16);ctx.closePath();
    ctx.fillStyle=i%2===0?c1:c2;ctx.fill();
    ctx.beginPath();ctx.arc(sz*.56,0,sz*.115,0,Math.PI*2);ctx.fillStyle=i%2===0?c2:c1;ctx.globalAlpha=.76;ctx.fill();
    [.22,.44].forEach((k,ki)=>{ctx.beginPath();ctx.arc(sz*k,0,sz*.052,0,Math.PI*2);ctx.fillStyle=ki%2===0?c1:c2;ctx.globalAlpha=.43;ctx.fill();});
    ctx.restore();
  }
  ctx.globalAlpha=.96;ctx.beginPath();ctx.arc(0,0,sz*.13,0,Math.PI*2);
  ctx.fillStyle='#ffffff';ctx.fill();ctx.restore();
}

function drawAllPats(){
  pCtx.clearRect(0,0,W,H);
  crossings.forEach(c=>kaleido(pCtx,c.x,c.y,c.c1,c.c2,G*0.86,dark));
}

function updateSidebar(){
  const cols=new Set();
  HRS.forEach(h=>{const d=slots[h];if(d.my&&d.my.length>0)cols.add(d.myCol);d.bots.forEach(b=>cols.add(b.col));});
  const pr=document.getElementById('prow');let i=0,html='';
  cols.forEach(c=>{i++;html+=`<div class="pchip"><div class="pdot" style="background:${c}"></div>參與者 ${i}</div>`;});
  pr.innerHTML=html;document.getElementById('sppl').textContent=i||0;
}

function updatePreview(){
  const ec=document.getElementById('eprev'),ectx=ec.getContext('2d');
  ectx.clearRect(0,0,88,88);ectx.fillStyle=dark?'#080810':'#f7f5f0';ectx.fillRect(0,0,88,88);
  const sc=88/W;ectx.save();ectx.scale(sc,sc);
  HRS.forEach(h=>{const d=slots[h];if(d.my)drawPath(ectx,d.my,d.myCol,.22,2);d.bots.forEach(b=>drawPath(ectx,b.pts,b.col,.18,2));});
  crossings.forEach(c=>kaleido(ectx,c.x,c.y,c.c1,c.c2,G*.65,dark));
  ectx.restore();
  const dd=new Date();document.getElementById('edate').textContent=`${dd.getFullYear()} / ${String(dd.getMonth()+1).padStart(2,'0')} / ${String(dd.getDate()).padStart(2,'0')}`;
}

function redraw(){
  drawBg(mCtx,W,H,dark);
  const ch=HRS[curSlot];
  HRS.forEach(h=>{
    const d=slots[h];const act=h===ch;const a=act?.88:.22;const lw=act?3.5:2;
    if(d.my)drawPath(mCtx,d.my,d.myCol,a,lw);
    d.bots.forEach(b=>drawPath(mCtx,b.pts,b.col,a*.7,lw-.4));
  });
  calcCross();drawAllPats();updateSidebar();updatePreview();
}

function gpos(e){
  const r=mc.getBoundingClientRect(),sx=W/r.width;
  const t=e.touches?e.touches[0]:e;
  return{x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sx};
}
mc.addEventListener('mousedown',e=>{drawing=true;const{x,y}=gpos(e);const s=snap(x,y);const h=HRS[curSlot];slots[h].my=[s];slots[h].myCol=myCol;redraw();});
mc.addEventListener('mousemove',e=>{if(!drawing)return;const{x,y}=gpos(e);const s=snap(x,y);const h=HRS[curSlot];const last=slots[h].my?.[slots[h].my.length-1];if(!last||last.col!==s.col||last.row!==s.row){if(last&&Math.abs(s.col-last.col)+Math.abs(s.row-last.row)<=2){slots[h].my.push(s);redraw();}}});
mc.addEventListener('mouseup',()=>drawing=false);mc.addEventListener('mouseleave',()=>drawing=false);
mc.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const{x,y}=gpos(e);const s=snap(x,y);const h=HRS[curSlot];slots[h].my=[s];slots[h].myCol=myCol;redraw();},{passive:false});
mc.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const{x,y}=gpos(e);const s=snap(x,y);const h=HRS[curSlot];const last=slots[h].my?.[slots[h].my.length-1];if(!last||last.col!==s.col||last.row!==s.row){if(last&&Math.abs(s.col-last.col)+Math.abs(s.row-last.row)<=2){slots[h].my.push(s);redraw();}}},{passive:false});
mc.addEventListener('touchend',()=>drawing=false);

function genBot(){
  const col=RB[(bi*3+5)%RB.length];bi++;
  HRS.forEach(h=>{
    if(Math.random()<.55){
      const pts=[];let c=1+Math.floor(Math.random()*(COLS-2)),r=1+Math.floor(Math.random()*(ROWS-2));
      pts.push({col:c,row:r,x:OX+c*G,y:OY+r*G});
      for(let i=0;i<8+Math.floor(Math.random()*10);i++){
        const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
        c=Math.max(0,Math.min(COLS,c+d[0]));r=Math.max(0,Math.min(ROWS,r+d[1]));
        pts.push({col:c,row:r,x:OX+c*G,y:OY+r*G});
      }
      slots[h].bots.push({pts,col});
    }
  });
  redraw();
}

document.getElementById('addbot').addEventListener('click',genBot);
document.getElementById('clearbtn').addEventListener('click',()=>{HRS.forEach(h=>{slots[h]={my:null,myCol:RB[0],bots:[]};});crossings=[];bi=0;redraw();});

document.getElementById('demobtn').addEventListener('click',()=>{
  HRS.forEach(h=>{slots[h]={my:null,myCol:RB[0],bots:[]};});crossings=[];bi=0;
  [0,2,4,6,8].forEach((ci,pi)=>{
    const col=RB[ci];
    HRS.forEach(h=>{
      if(Math.random()<.6){
        const pts=[];let c=1+Math.floor(Math.random()*(COLS-2)),r=1+Math.floor(Math.random()*(ROWS-2));
        pts.push({col:c,row:r,x:OX+c*G,y:OY+r*G});
        for(let i=0;i<9+Math.floor(Math.random()*8);i++){
          const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
          c=Math.max(0,Math.min(COLS,c+d[0]));r=Math.max(0,Math.min(ROWS,r+d[1]));
          pts.push({col:c,row:r,x:OX+c*G,y:OY+r*G});
        }
        if(pi===0){slots[h].my=pts;slots[h].myCol=col;}
        else slots[h].bots.push({pts,col});
      }
    });
  });
  redraw();
});

document.getElementById('expbtn').addEventListener('click',()=>{
  const cv=document.createElement('canvas');cv.width=760;cv.height=840;
  const ctx2=cv.getContext('2d');
  drawBg(ctx2,760,840,dark);
  HRS.forEach(h=>{const d=slots[h];if(d.my)drawPath(ctx2,d.my,d.myCol,.28,2.5);d.bots.forEach(b=>drawPath(ctx2,b.pts,b.col,.2,2.5));});
  crossings.forEach(c=>kaleido(ctx2,c.x,c.y,c.c1,c.c2,G*.86,dark));
  ctx2.fillStyle=dark?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.28)';
  ctx2.font='500 13px -apple-system,sans-serif';ctx2.textAlign='center';
  const dd=new Date();
  ctx2.fillText(`${dd.getFullYear()} · ${String(dd.getMonth()+1).padStart(2,'0')} · ${String(dd.getDate()).padStart(2,'0')}  mood trace`,380,825);
  const a=document.createElement('a');
  a.download=`mood-trace-${dd.getFullYear()}${String(dd.getMonth()+1).padStart(2,'0')}${String(dd.getDate()).padStart(2,'0')}.png`;
  a.href=cv.toDataURL('image/png');a.click();
});

drawBg(mCtx,W,H,dark);redraw();
</script>
</body>
</html>
