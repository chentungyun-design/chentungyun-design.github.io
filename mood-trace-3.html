<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情軌跡 · Mood Trace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#080810;color:#e8e8ec;transition:background .3s,color .3s;}
body.light{background:#f7f5f0;color:#1a1a1a;}
#app{max-width:780px;margin:0 auto;padding:16px;}
h1{font-size:13px;font-weight:500;letter-spacing:.1em;opacity:.4;margin-bottom:14px;}
#top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.cb{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s,border-color .1s;flex-shrink:0;}
.cb.active{border-color:#fff;transform:scale(1.18);}
body.light .cb.active{border-color:#222;}
.sep{width:1px;height:18px;background:rgba(255,255,255,0.12);flex-shrink:0;}
body.light .sep{background:rgba(0,0,0,0.12);}
.btn{font-size:12px;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.05);color:#e8e8ec;}
body.light .btn{border-color:rgba(0,0,0,0.14);background:rgba(0,0,0,0.04);color:#1a1a1a;}
.btn:hover{background:rgba(255,255,255,0.1);}
body.light .btn:hover{background:rgba(0,0,0,0.08);}
#canvas-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.07);}
body.light #canvas-wrap{border-color:rgba(0,0,0,0.09);}
canvas{display:block;width:100%;}
#pc{position:absolute;top:0;left:0;pointer-events:none;width:100%;}
#time-section{margin-top:14px;}
#ttrack-wrap{position:relative;padding-bottom:20px;}
#ttrack{display:flex;align-items:flex-end;height:32px;}
.ts{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;position:relative;}
.ts-tick{width:1px;background:rgba(255,255,255,0.18);}
body.light .ts-tick{background:rgba(0,0,0,0.16);}
.ts.major .ts-tick{width:1.5px;background:rgba(255,255,255,0.32);}
body.light .ts.major .ts-tick{background:rgba(0,0,0,0.28);}
.ts.active .ts-tick{background:#fff;width:2px;}
body.light .ts.active .ts-tick{background:#222;}
.ts-lbl{position:absolute;bottom:-17px;font-size:10px;color:rgba(255,255,255,0.32);white-space:nowrap;transform:translateX(-50%);left:50%;display:none;}
body.light .ts-lbl{color:rgba(0,0,0,0.32);}
.ts.major .ts-lbl,.ts.active .ts-lbl{display:block;}
.ts.active .ts-lbl{color:#fff;font-weight:500;}
body.light .ts.active .ts-lbl{color:#222;}
#ttrack-baseline{position:absolute;bottom:20px;left:0;right:0;height:1px;background:rgba(255,255,255,0.08);}
body.light #ttrack-baseline{background:rgba(0,0,0,0.08);}
#tlabel{font-size:11px;opacity:.45;margin-top:6px;}
#prow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
.pchip{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;opacity:.65;}
body.light .pchip{border-color:rgba(0,0,0,0.1);}
.pchip.me{opacity:1;border-color:rgba(255,255,255,0.32);}
body.light .pchip.me{border-color:rgba(0,0,0,0.32);}
.pdots{display:flex;gap:3px;}
.pdot{width:8px;height:8px;border-radius:50%;}
#stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.stat{padding:5px 11px;border-radius:8px;font-size:12px;background:rgba(255,255,255,0.04);opacity:.8;}
body.light .stat{background:rgba(0,0,0,0.04);}
#export-row{display:flex;align-items:center;gap:10px;margin-top:14px;}
#edate{font-size:12px;opacity:.5;}
#footer{margin-top:28px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.06);text-align:center;line-height:1.9;}
body.light #footer{border-color:rgba(0,0,0,0.07);}
</style>
</head>
<body>
<div id="app">
  <h1>MOOD TRACE · 心情軌跡</h1>
  <div id="top">
    <div id="crow" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
    <div class="sep"></div>
    <button class="btn" id="bgtog">切換背景</button>
    <button class="btn" id="addperson">+ 加路人</button>
    <button class="btn" id="demobtn">示範</button>
    <button class="btn" id="clearbtn">清除</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="mc" width="760" height="460"></canvas>
    <canvas id="pc" width="760" height="460"></canvas>
  </div>
  <div id="time-section">
    <div id="ttrack-wrap">
      <div id="ttrack-baseline"></div>
      <div id="ttrack"></div>
    </div>
    <div id="tlabel">時段：06:00 清晨 — 選顏色後在畫布上拖曳，記錄這個時段的心情軌跡</div>
  </div>
  <div id="prow"><span style="font-size:11px;opacity:.38;">參與者：</span></div>
  <div id="stats">
    <div class="stat">交錯點 <strong id="sc">0</strong></div>
    <div class="stat">圖騰 <strong id="sp">0</strong></div>
    <div class="stat">人數 <strong id="sppl">1</strong></div>
  </div>
  <div id="export-row">
    <span id="edate"></span>
    <button class="btn" id="expbtn">匯出今日圖騰 PNG</button>
  </div>
  <div id="footer">
    <div style="font-size:13px;font-weight:500;letter-spacing:.07em;opacity:.6;">MOOD TRACE · 心情軌跡</div>
    <div style="font-size:11px;opacity:.32;margin-top:2px;">© 2026 Chen Tung-Yun · Mood Trace. All rights reserved.</div>
    <div style="font-size:11px;opacity:.32;">本作品之概念、設計與互動形式，版權所有，未經授權不得複製或轉載。</div>
    <div style="font-size:10px;opacity:.2;margin-top:5px;letter-spacing:.04em;">Original concept &amp; design by chentungyun · Created with ♥</div>
  </div>
</div>
<script>
const mc=document.getElementById('mc'),pc=document.getElementById('pc');
const mCtx=mc.getContext('2d'),pCtx=pc.getContext('2d');
const W=760,H=460,G=38;
const COLS=Math.floor(W/G),ROWS=Math.floor(H/G);
const OX=(W-COLS*G)/2,OY=(H-ROWS*G)/2;
const RB=['#FF3B3B','#FF7A00','#FFB800','#84CC16','#22C55E','#06B6D4','#3B82F6','#6366F1','#A855F7','#EC4899'];
const RBN=['紅','橙','黃','草綠','翠綠','青','藍','靛','紫','粉'];
const HRS=Array.from({length:18},(_,i)=>6+i);
const TNAME=h=>h<8?`${h}:00 清晨`:h<12?`${h}:00 上午`:h===12?'12:00 正午':h<18?`${h}:00 下午`:h<20?`${h}:00 傍晚`:`${h}:00 深夜`;

let dark=true,curSlot=0,drawing=false,activeIdx=0;

// One person = name + one slot per hour (pts + color)
function makePerson(name,defCol){
  const slots={};
  HRS.forEach(h=>slots[h]={pts:null,col:defCol||RB[0]});
  return{name,slots};
}
let persons=[makePerson('你',RB[0])];
let crossings=[];

function curP(){return persons[activeIdx];}
function curSD(){return curP().slots[HRS[curSlot]];}

function snap(x,y){
  const c=Math.round((x-OX)/G),r=Math.round((y-OY)/G);
  const cc=Math.max(0,Math.min(COLS,c)),rr=Math.max(0,Math.min(ROWS,r));
  return{col:cc,row:rr,x:OX+cc*G,y:OY+rr*G};
}
function gpos(e){
  const rect=mc.getBoundingClientRect(),sx=W/rect.width;
  const t=e.touches?e.touches[0]:e;
  return{x:(t.clientX-rect.left)*sx,y:(t.clientY-rect.top)*sx};
}

function drawBg(ctx,w,h){
  ctx.fillStyle=dark?'#080810':'#f7f5f0';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=dark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.07)';ctx.lineWidth=0.5;
  for(let c=0;c<=COLS;c++){const x=OX+c*G;ctx.beginPath();ctx.moveTo(x,OY);ctx.lineTo(x,OY+ROWS*G);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){const y=OY+r*G;ctx.beginPath();ctx.moveTo(OX,y);ctx.lineTo(OX+COLS*G,y);ctx.stroke();}
  ctx.fillStyle=dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.1)';
  for(let c=0;c<=COLS;c++)for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.arc(OX+c*G,OY+r*G,1.7,0,Math.PI*2);ctx.fill();}
}

function drawPath(ctx,pts,col,alpha,lw){
  if(!pts||pts.length<2)return;
  ctx.save();ctx.strokeStyle=col;ctx.globalAlpha=alpha;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();
  ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
  ctx.beginPath();ctx.arc(pts[pts.length-1].x,pts[pts.length-1].y,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function pk(p){return p.col+'_'+p.row;}

function calcCross(){
  crossings=[];
  HRS.forEach(h=>{
    const all=[];
    persons.forEach(p=>{const sd=p.slots[h];if(sd.pts&&sd.pts.length>0)all.push({pts:sd.pts,col:sd.col});});
    for(let i=0;i<all.length;i++){
      const sa=new Set(all[i].pts.map(pk));
      for(let j=i+1;j<all.length;j++){
        all[j].pts.forEach(p=>{
          if(sa.has(pk(p))&&!crossings.find(c=>c.col===p.col&&c.row===p.row))
            crossings.push({...p,c1:all[i].col,c2:all[j].col});
        });
      }
    }
  });
  document.getElementById('sc').textContent=crossings.length;
  document.getElementById('sp').textContent=crossings.length;
}

function kaleido(ctx,x,y,c1,c2,sz){
  sz=sz||G*0.86;ctx.save();ctx.translate(x,y);
  for(let i=0;i<10;i++){
    ctx.save();ctx.rotate((i/10)*Math.PI*2);
    ctx.globalAlpha=0.62;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(sz*.43,-sz*.16);ctx.lineTo(sz*.84,0);ctx.lineTo(sz*.43,sz*.16);ctx.closePath();
    ctx.fillStyle=i%2===0?c1:c2;ctx.fill();
    ctx.beginPath();ctx.arc(sz*.56,0,sz*.115,0,Math.PI*2);ctx.fillStyle=i%2===0?c2:c1;ctx.globalAlpha=.76;ctx.fill();
    [.22,.44].forEach((k,ki)=>{ctx.beginPath();ctx.arc(sz*k,0,sz*.052,0,Math.PI*2);ctx.fillStyle=ki%2===0?c1:c2;ctx.globalAlpha=.43;ctx.fill();});
    ctx.restore();
  }
  ctx.globalAlpha=.96;ctx.beginPath();ctx.arc(0,0,sz*.13,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
}

function redraw(){
  drawBg(mCtx,W,H);
  const activeH=HRS[curSlot];
  persons.forEach((p,pi)=>{
    const isMe=(pi===activeIdx);
    HRS.forEach(h=>{
      const sd=p.slots[h];if(!sd.pts||sd.pts.length<2)return;
      const cur=(h===activeH);
      const alpha=cur?(isMe?.9:.6):(isMe?.25:.12);
      const lw=cur?(isMe?3.5:2.5):(isMe?2:1.5);
      drawPath(mCtx,sd.pts,sd.col,alpha,lw);
    });
  });
  calcCross();
  pCtx.clearRect(0,0,W,H);
  crossings.forEach(c=>kaleido(pCtx,c.x,c.y,c.c1,c.c2));
  updateUI();
}

function updateUI(){
  document.getElementById('sppl').textContent=persons.length;
  const pr=document.getElementById('prow');
  pr.innerHTML='<span style="font-size:11px;opacity:.38;">參與者：</span>';
  persons.forEach((p,pi)=>{
    // collect unique colors this person has used across all time slots
    const usedCols=[...new Set(HRS.map(h=>p.slots[h].pts&&p.slots[h].pts.length>0?p.slots[h].col:null).filter(Boolean))];
    const chip=document.createElement('div');
    chip.className='pchip'+(pi===activeIdx?' me':'');
    const dots=usedCols.length
      ?usedCols.map(c=>`<div class="pdot" style="background:${c}"></div>`).join('')
      :`<div class="pdot" style="background:rgba(128,128,128,0.25)"></div>`;
    chip.innerHTML=`<div class="pdots">${dots}</div><span>${p.name}</span>`;
    chip.addEventListener('click',()=>{activeIdx=pi;mkColors();redraw();});
    pr.appendChild(chip);
  });
  const dd=new Date();
  document.getElementById('edate').textContent=
    `${dd.getFullYear()} / ${String(dd.getMonth()+1).padStart(2,'0')} / ${String(dd.getDate()).padStart(2,'0')}`;
}

function mkColors(){
  const row=document.getElementById('crow');row.innerHTML='';
  const cur=curSD().col;
  RB.forEach((c,i)=>{
    const b=document.createElement('div');
    b.className='cb'+(c===cur?' active':'');
    b.style.background=c;b.title=RBN[i];
    b.addEventListener('click',()=>{
      curSD().col=c;  // only changes color for this hour slot
      document.querySelectorAll('.cb').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
    row.appendChild(b);
  });
}

function mkTrack(){
  const tr=document.getElementById('ttrack');tr.innerHTML='';
  HRS.forEach((h,i)=>{
    const major=(h%6===0);
    const s=document.createElement('div');
    s.className='ts'+(i===curSlot?' active':'')+(major?' major':'');
    s.innerHTML=`<div class="ts-tick" style="height:${major?22:11}px"></div><span class="ts-lbl">${String(h).padStart(2,'0')}</span>`;
    s.addEventListener('click',()=>{
      curSlot=i;mkTrack();mkColors();
      document.getElementById('tlabel').textContent=`時段：${TNAME(h)} — 選顏色後在畫布上拖曳，記錄這個時段的心情軌跡`;
      redraw();
    });
    tr.appendChild(s);
  });
}

// drawing events
mc.addEventListener('mousedown',e=>{drawing=true;const{x,y}=gpos(e);curSD().pts=[snap(x,y)];redraw();});
mc.addEventListener('mousemove',e=>{
  if(!drawing)return;const{x,y}=gpos(e);const s=snap(x,y);const sd=curSD();const last=sd.pts?.[sd.pts.length-1];
  if(!last||last.col!==s.col||last.row!==s.row){if(last&&Math.abs(s.col-last.col)+Math.abs(s.row-last.row)<=3){sd.pts.push(s);redraw();}}
});
mc.addEventListener('mouseup',()=>drawing=false);
mc.addEventListener('mouseleave',()=>drawing=false);
mc.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const{x,y}=gpos(e);curSD().pts=[snap(x,y)];redraw();},{passive:false});
mc.addEventListener('touchmove',e=>{
  e.preventDefault();if(!drawing)return;const{x,y}=gpos(e);const s=snap(x,y);const sd=curSD();const last=sd.pts?.[sd.pts.length-1];
  if(!last||last.col!==s.col||last.row!==s.row){if(last&&Math.abs(s.col-last.col)+Math.abs(s.row-last.row)<=3){sd.pts.push(s);redraw();}}
},{passive:false});
mc.addEventListener('touchend',()=>drawing=false);

document.getElementById('bgtog').addEventListener('click',()=>{dark=!dark;document.body.classList.toggle('light',!dark);mkTrack();redraw();});

document.getElementById('addperson').addEventListener('click',()=>{
  const idx=persons.length;
  persons.push(makePerson(`路人 ${idx}`,RB[(idx*3)%RB.length]));
  activeIdx=persons.length-1;mkColors();redraw();
});

document.getElementById('clearbtn').addEventListener('click',()=>{
  persons=[makePerson('你',RB[0])];activeIdx=0;crossings=[];curSlot=0;
  mkColors();mkTrack();drawBg(mCtx,W,H);pCtx.clearRect(0,0,W,H);
  document.getElementById('sc').textContent='0';
  document.getElementById('sp').textContent='0';
  updateUI();
});

document.getElementById('demobtn').addEventListener('click',()=>{
  persons=[makePerson('你',RB[0])];activeIdx=0;crossings=[];
  const palette=[RB[0],RB[0],RB[2],RB[2],RB[4],RB[4],RB[6],RB[6],RB[8],RB[8]];
  HRS.forEach((h,hi)=>{
    if(hi>=palette.length)return;
    const col=palette[hi];const pts=[];
    let c=2+Math.floor(Math.random()*(COLS-4)),r=2+Math.floor(Math.random()*(ROWS-4));
    pts.push({col:c,row:r,x:OX+c*G,y:OY+r*G});
    for(let i=0;i<10+Math.floor(Math.random()*6);i++){
      const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
      c=Math.max(1,Math.min(COLS-1,c+d[0]));r=Math.max(1,Math.min(ROWS-1,r+d[1]));
      pts.push({col:c,row:r,x:OX+c*G,y:OY+r*G});
    }
    persons[0].slots[h]={pts,col};
  });
  for(let pi=1;pi<=2;pi++){
    const p=makePerson(`路人 ${pi}`,RB[(pi*2)%RB.length]);
    HRS.forEach(h=>{
      if(Math.random()<0.55){
        const col=RB[(pi*2+HRS.indexOf(h))%RB.length];const pts=[];
        let c=1+Math.floor(Math.random()*(COLS-2)),r=1+Math.floor(Math.random()*(ROWS-2));
        pts.push({col:c,row:r,x:OX+c*G,y:OY+r*G});
        for(let i=0;i<8+Math.floor(Math.random()*8);i++){
          const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
          c=Math.max(1,Math.min(COLS-1,c+d[0]));r=Math.max(1,Math.min(ROWS-1,r+d[1]));
          pts.push({col:c,row:r,x:OX+c*G,y:OY+r*G});
        }
        p.slots[h]={pts,col};
      }
    });
    persons.push(p);
  }
  mkColors();mkTrack();redraw();
});

document.getElementById('expbtn').addEventListener('click',()=>{
  // Draw onto a canvas the same size as the main canvas
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c2=cv.getContext('2d');
  // Background
  c2.fillStyle=dark?'#080810':'#f7f5f0';c2.fillRect(0,0,W,H);
  c2.strokeStyle=dark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.07)';c2.lineWidth=0.5;
  for(let col=0;col<=COLS;col++){const x=OX+col*G;c2.beginPath();c2.moveTo(x,OY);c2.lineTo(x,OY+ROWS*G);c2.stroke();}
  for(let row=0;row<=ROWS;row++){const y=OY+row*G;c2.beginPath();c2.moveTo(OX,y);c2.lineTo(OX+COLS*G,y);c2.stroke();}
  c2.fillStyle=dark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.1)';
  for(let col=0;col<=COLS;col++)for(let row=0;row<=ROWS;row++){c2.beginPath();c2.arc(OX+col*G,OY+row*G,1.7,0,Math.PI*2);c2.fill();}
  // Paths
  persons.forEach(p=>HRS.forEach(h=>{const sd=p.slots[h];if(sd.pts)drawPath(c2,sd.pts,sd.col,.3,2.5);}));
  // Patterns
  crossings.forEach(c=>kaleido(c2,c.x,c.y,c.c1,c.c2));
  // Watermark
  c2.fillStyle=dark?'rgba(255,255,255,0.22)':'rgba(0,0,0,0.22)';
  c2.font='11px -apple-system,sans-serif';c2.textAlign='center';
  const dd=new Date();
  c2.fillText(`${dd.getFullYear()} · ${String(dd.getMonth()+1).padStart(2,'0')} · ${String(dd.getDate()).padStart(2,'0')}  ·  mood trace  ·  chentungyun`,W/2,H-10);
  // Download — must append to DOM for Firefox/Safari compatibility
  const a=document.createElement('a');
  a.download=`mood-trace-${dd.getFullYear()}${String(dd.getMonth()+1).padStart(2,'0')}${String(dd.getDate()).padStart(2,'0')}.png`;
  a.href=cv.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

mkColors();mkTrack();drawBg(mCtx,W,H);redraw();
</script>
</body>
</html>
